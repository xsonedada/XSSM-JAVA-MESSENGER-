<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>XSSM – Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="particles" id="particles"></div>
    <div class="auth-container">
        <div class="auth-card glass">
            <div class="auth-logo"><i class="fas fa-comment-dots"></i> XSSM</div>
            <div class="auth-title">Вход в аккаунт</div>
            <div class="error-message" id="errorMessage" style="display:none;"></div>
            <form method="POST" action="/login">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" required placeholder="Логин">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" required placeholder="Пароль">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
            <div class="auth-footer">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            const msg = document.getElementById('errorMessage');
            msg.textContent = 'Неверный логин или пароль';
            msg.style.display = 'block';
        }
        // частицы
        const particles = document.getElementById('particles');
        for (let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random()*100+'%';
            p.style.top = Math.random()*100+'%';
            p.style.width = p.style.height = (Math.random()*4+2)+'px';
            particles.appendChild(p);
        }
    </script>
</body>
</html>
